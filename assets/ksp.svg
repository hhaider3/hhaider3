<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d"><title id="t">Kerbal-ish Space Program</title><desc id="d">Animated spaceflight map: a staged rocket climbs off a small planet, settles into a dashed parking orbit, and a maneuver node plots a transfer to the moon while the flight readout counts up.</desc><defs>
<clipPath id="card"><rect width="480" height="270" rx="16"/></clipPath>
<linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset="1" stop-color="#141338"/></linearGradient>
<radialGradient id="pl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#7ee0b0"/><stop offset=".45" stop-color="#2f9f86"/><stop offset="1" stop-color="#123a52"/></radialGradient>
<radialGradient id="atm"><stop offset=".78" stop-color="#4fe3d4" stop-opacity="0"/><stop offset=".86" stop-color="#4fe3d4" stop-opacity=".35"/><stop offset="1" stop-color="#4fe3d4" stop-opacity="0"/></radialGradient>
<radialGradient id="mun" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d9dde6"/><stop offset="1" stop-color="#5d6375"/></radialGradient>
