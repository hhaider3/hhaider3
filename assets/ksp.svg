</defs><style>
.pulse{animation:pu 2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-40}}
.xfer{animation:dash 2.4s linear infinite}
@keyframes xin{0%,52%{opacity:0}58%,94%{opacity:1}100%{opacity:0}}
.xf{animation:xin 12s linear infinite}
@keyframes node{0%,50%{opacity:0;transform:scale(.3)}56%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
.nd{animation:node 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flk{0%,100%{opacity:.95}50%{opacity:.55}}
.flame{animation:flk .18s linear infinite}
@keyframes fuel{0%{transform:scaleX(1)}30%{transform:scaleX(.42)}100%{transform:scaleX(.42)}}
.fu{animation:fuel 12s ease-out infinite;transform-box:fill-box;transform-origin:left}
@keyframes ph1{0%,30%{opacity:1}31%,100%{opacity:0}}
@keyframes ph2{0%,30%{opacity:0}31%,52%{opacity:1}53%,100%{opacity:0}}
@keyframes ph3{0%,52%{opacity:0}53%,98%{opacity:1}100%{opacity:0}}
.p1{animation:ph1 12s steps(1) infinite}.p2{animation:ph2 12s steps(1) infinite}.p3{animation:ph3 12s steps(1) infinite}
</style>
