<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d"><title id="t">Desktop portfolio</title><desc id="d">Animated Windows 7 style desktop where an orbiting globe, an about window and a projects folder open one after another while a cursor moves between them.</desc><defs>
<clipPath id="card"><rect width="480" height="270" rx="16"/></clipPath>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b4d8c"/><stop offset=".5" stop-color="#1a8fb5"/><stop offset="1" stop-color="#0d6a7a"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#bfe3f7" stop-opacity=".6"/></linearGradient>
<linearGradient id="task" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8db8" stop-opacity=".9"/><stop offset=".5" stop-color="#16324f" stop-opacity=".95"/><stop offset="1" stop-color="#0b1c30"/></linearGradient>
<radialGradient id="orb" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#9be8ff"/><stop offset="1" stop-color="#1273c9"/></radialGradient>
</defs><style>
@keyframes w1{0%,4%{opacity:0;transform:scale(.7) translateY(30px)}12%,100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes w2{0%,16%{opacity:0;transform:scale(.7) translateY(30px)}24%,100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes w3{0%,28%{opacity:0;transform:scale(.7) translateY(30px)}36%,100%{opacity:1;transform:scale(1) translateY(0)}}
.w{transform-box:fill-box;transform-origin:center bottom}
.w1{animation:w1 12s ease-out infinite}.w2{animation:w2 12s ease-out infinite}.w3{animation:w3 12s ease-out infinite}
@keyframes cur{0%{transform:translate(380px,230px)}14%{transform:translate(120px,70px)}28%{transform:translate(300px,80px)}38%{transform:translate(380px,150px)}60%{transform:translate(200px,120px)}80%{transform:translate(120px,70px)}100%{transform:translate(380px,230px)}}
.cur{animation:cur 12s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.10}50%{opacity:.2}}
.ray{animation:ray 7s ease-in-out infinite}
@keyframes ico{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.pulse{animation:pu 2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}
</style>
