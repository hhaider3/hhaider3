<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-labelledby="t d"><title id="t">andrompv</title><desc id="d">Animated Android phone in landscape: double-tap seek ripples, a brightness swipe slider and a glass control bar over drifting video colours.</desc><defs><radialGradient id="ap0"><stop offset="0" stop-color="#7c5cff" stop-opacity=".95"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient><radialGradient id="ap1"><stop offset="0" stop-color="#35d6c8" stop-opacity=".95"/><stop offset="1" stop-color="#35d6c8" stop-opacity="0"/></radialGradient><radialGradient id="ap2"><stop offset="0" stop-color="#b6f36b" stop-opacity=".95"/><stop offset="1" stop-color="#b6f36b" stop-opacity="0"/></radialGradient>
<clipPath id="scr"><rect x="48" y="72" width="384" height="170" rx="18"/></clipPath>
<linearGradient id="bga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a2e"/><stop offset="1" stop-color="#1b1236"/></linearGradient>
<clipPath id="card"><rect width="480" height="270" rx="16"/></clipPath>
<linearGradient id="shade2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></linearGradient>
</defs><style>
@keyframes b0{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,20px)}}
@keyframes b1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,25px)}}
@keyframes b2{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
.blob0{animation:b0 8s ease-in-out infinite}.blob1{animation:b1 10s ease-in-out infinite}.blob2{animation:b2 12s ease-in-out infinite}
@keyframes rip{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes seekR{0%,4%{opacity:0;transform:translateX(-6px)}8%,22%{opacity:1;transform:translateX(0)}30%,100%{opacity:0}}
@keyframes seekL{0%,44%{opacity:0;transform:translateX(6px)}48%,62%{opacity:1;transform:translateX(0)}70%,100%{opacity:0}}
@keyframes bright{0%,72%{opacity:0}76%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes bfill{0%,76%{transform:scaleY(.3)}90%,100%{transform:scaleY(.85)}}
@keyframes prog{0%{transform:scaleX(.18)}100%{transform:scaleX(.7)}}
.r{transform-box:fill-box;transform-origin:center}
.rR{animation:rip 10s ease-out infinite;animation-delay:0s}
.rR2{animation:rip 10s ease-out infinite;animation-delay:.25s}
.sR{animation:seekR 10s ease-out infinite}
.sL{animation:seekL 10s ease-out infinite}
.br{animation:bright 10s linear infinite}
.bf{animation:bfill 10s ease-out infinite;transform-box:fill-box;transform-origin:bottom}
.pr{animation:prog 40s linear infinite;transform-box:fill-box;transform-origin:left}
.pulse{animation:pu 2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.4}50%{opacity:1}}

@keyframes ripA{0%{transform:scale(.15);opacity:0}5%{opacity:.85}14%{transform:scale(1.5);opacity:0}16%,100%{opacity:0}}
@keyframes ripB{0%,6%{transform:scale(.15);opacity:0}11%{opacity:.85}20%{transform:scale(1.5);opacity:0}22%,100%{opacity:0}}
@keyframes ripC{0%,44%{transform:scale(.15);opacity:0}49%{opacity:.85}58%{transform:scale(1.5);opacity:0}60%,100%{opacity:0}}
.rA{animation:ripA 10s linear infinite}.rB{animation:ripB 10s linear infinite}.rC{animation:ripC 10s linear infinite}
</style>
