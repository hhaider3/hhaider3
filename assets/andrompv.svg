 <g class="sL" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff"><text x="108" y="162" text-anchor="middle">− 10s ◀◀</text></g>
